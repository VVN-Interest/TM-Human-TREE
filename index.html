<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心誠中學 Open Day：AI 校園特工大挑戰</title>
    <!-- 引入 Tailwind CSS (極簡快速排版) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Teachable Machine Pose 相關庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <!-- 引入 Canvas Confetti (通關彩帶特效) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* 自訂字體與全螢幕設定 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a; /* 科技感深藍底色 */
            color: white;
            overflow: hidden; /* 防止螢幕滾動 */
            user-select: none;
        }

        /* 遊戲畫面容器，改為 1:1 比例 */
        .game-container {
            aspect-ratio: 16 / 9;
            max-height: 100vh;
            width: 100%;
            max-width: 177.78vh; /* ✅ 16/9 * 100 */
            margin: 0 auto;
            position: relative;
            background: #1e293b;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 1rem;
            overflow: hidden;
        }

        /* 隱藏原生鏡頭，只顯示 Canvas (因為我們要自己畫骨架) */
        #webcam-container canvas {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 關鍵！完整保留 100% 畫面 */
            background-color: #0f172a; /* 萬一螢幕比例不同，旁邊補黑邊，像看電影一樣有質感 */
            transform: scaleX(-1); /* 保持鏡像翻轉 */
        }

        /* 能量條特效 (CSS 動畫) */
        .progress-bar {
            transition: width 0.1s linear, background-color 0.3s ease;
        }
        .charging-glow {
            animation: pulse-glow 0.5s infinite alternate;
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px #facc15, 0 0 20px #facc15; }
            to { box-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444; }
        }

        /* 動態提示圖示 */
        .pose-icon {
            animation: bounce-slight 2s infinite;
        }
        @keyframes bounce-slight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 畫面切換淡入淡出 */
        .screen {
            transition: opacity 0.5s ease-in-out, visibility 0.5s;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hidden-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .active-screen {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="game-container relative">
        
        <!-- ==================== 1. 待機畫面 (Attract Mode) ==================== -->
        <div id="screen-start" class="screen active-screen bg-slate-900 z-50">
            <div class="text-center space-y-8">
                <!-- 假裝有 Logo -->
                <div class="w-32 h-32 mx-auto bg-blue-500 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(59,130,246,0.8)]">
                    <span class="text-4xl font-bold">心誠</span>
                </div>
                <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 tracking-wider drop-shadow-lg">
                    AI 校園特工大挑戰
                </h1>
                <p class="text-2xl text-gray-300">請走到地貼位置，準備啟動隱藏魔法！</p>
                <button id="btn-start" class="mt-8 px-12 py-5 bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-black text-3xl font-bold rounded-full shadow-[0_0_20px_rgba(250,204,21,0.6)] transform transition hover:scale-105 active:scale-95">
                    開始挑戰 START
                </button>
            </div>
            <!-- 右下角狀態提示 -->
            <div id="loading-msg" class="absolute bottom-4 right-4 text-sm text-gray-400 hidden">
                正在載入 AI 模型... 請稍候...
            </div>
        </div>

        <!-- ==================== 2. 闖關畫面 (Game Mode) ==================== -->
        <div id="screen-game" class="screen hidden-screen z-10">
            <!-- 攝影機與骨架畫布 (底層) -->
            <div id="webcam-container" class="absolute inset-0 w-full h-full">
                <!-- Canvas 會透過 JS 自動注入在這裡 -->
            </div>

            <!-- UI 覆蓋層 (頂層) -->
            <div class="absolute inset-0 flex flex-col justify-between p-8 pointer-events-none">
                
                <!-- 頂部：狀態與進度條 -->
                <div class="w-full">
                    <div class="flex justify-between items-center mb-4">
                        <div class="bg-black/60 px-6 py-2 rounded-full backdrop-blur-sm border border-slate-600">
                            <span class="text-xl font-bold text-yellow-400">關卡 <span id="ui-level">1</span> / 3</span>
                        </div>
                        <div class="bg-black/60 px-6 py-2 rounded-full backdrop-blur-sm border border-slate-600">
                            <span class="text-xl font-bold">目標姿勢：<span id="ui-pose-name" class="text-green-400">隱身</span></span>
                        </div>
                    </div>
                    
                    <!-- 能量進度條 -->
                    <div class="w-full h-12 bg-gray-800/80 rounded-full border-4 border-slate-700 overflow-hidden relative shadow-lg">
                        <div id="progress-fill" class="progress-bar h-full bg-gradient-to-r from-green-400 to-green-600 w-0"></div>
                        <div class="absolute inset-0 flex items-center justify-center font-bold text-xl drop-shadow-md text-white mix-blend-difference">
                            維持 3 秒鐘！
                        </div>
                    </div>
                </div>

                <!-- 左側：提示圖 (SVG Placeholder) -->
                <div class="self-start mt-auto mb-10 bg-white/50 p-6 rounded-2xl backdrop-blur-md border border-slate-600 flex flex-col items-center pose-icon">
                    <p class="[text-shadow:0_2px_4px_rgba(1,0,0,0.4)] text-4xl  mb-5 text-black">請跟著做</p>
                    <!-- ✅ 修改後：加入 img 標籤來準備接收 PNG 圖片 -->
                    <div id="pose-hint-icon" class="w-48 h-48 flex items-center justify-center">
                        <img id="pose-img" src="" alt="姿勢提示圖" class="w-full h-full object-contain drop-shadow-lg" />
                    </div>
                </div>
            </div>
            
            <!-- 關卡切換提示 (過場) -->
            <div id="level-transition" class="absolute inset-0 bg-black/80 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
                <h2 id="transition-text" class="text-7xl font-black text-yellow-400 scale-50 transition-transform duration-300"></h2>
            </div>
        </div>

        <!-- ==================== 3. 通關畫面 (Success Mode) ==================== -->
        <div id="screen-success" class="screen hidden-screen bg-gradient-to-b from-green-900 to-slate-900 z-50">
            <div class="text-center space-y-6 z-10">
                <div class="text-[120px] animate-bounce">🏆</div>
                <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 drop-shadow-lg">
                    任務完成！
                </h1>
                <p class="text-4xl font-bold text-white mt-4">你成功通過特工試煉！</p>
                <p id="countdown-text" class="text-xl text-gray-400 mt-8">60 秒後自動回到首頁...</p>
                
                <button id="btn-home" class="mt-8 px-10 py-4 bg-white text-green-900 text-2xl font-bold rounded-full shadow-lg hover:bg-gray-200 transition transform hover:scale-105 active:scale-95 pointer-events-auto">
                    返回總部 (首頁)
                </button>
            </div>
        </div>

    </div>

    <!-- ==================== JavaScript 遊戲邏輯 ==================== -->
    <script>
        /**
         * 【注意事項】
         * 請將下方的 URL 替換為你在 Teachable Machine 匯出的模型連結。
         * 例如： "https://teachablemachine.withgoogle.com/models/eVCVTj9bp/"
         * 注意：模型需要訓練至少 4 個 Class (隱身, 偽裝, 平衡, 以及一個 "None/背景" 類別)
         */
        const URL = "https://teachablemachine.withgoogle.com/models/maP2KgZct/"; 
        
        let model, webcam, ctx, labelContainer, maxPredictions;
        let isModelLoaded = false;
        let isGameRunning = false;

        // 遊戲設定
        const CONFIDENCE_THRESHOLD = 0.85; // 信心水準 > 85%
        const REQUIRED_HOLD_TIME = 3000; // 需要維持 3000 毫秒 (3秒)
        // ✅ 修改後：填入你真實的 PNG 圖片路徑
        const GAME_POSES = [
            { name: "隱身", image: "./image/B1.png" },      // 請確認檔名與副檔名正確
            { name: "偽裝", image: "./image/B2.png" },
            { name: "平衡", image: "./image/B3.png" }
        ];
        
        let currentPosesQueue = [];
        let currentTargetPose = null;
        let currentLevel = 1;
        
        // 計時與狀態變數
        let holdStartTime = 0;
        let isHolding = false;
        let lastFrameTime = 0;
        let returnHomeTimeout;

        // UI 元素
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenSuccess = document.getElementById('screen-success');
        const btnStart = document.getElementById('btn-start');
        const btnHome = document.getElementById('btn-home');
        const progressFill = document.getElementById('progress-fill');
        const uiLevel = document.getElementById('ui-level');
        const uiPoseName = document.getElementById('ui-pose-name');
        const poseHintIcon = document.getElementById('pose-hint-icon');
        const levelTransition = document.getElementById('level-transition');
        const transitionText = document.getElementById('transition-text');
        const loadingMsg = document.getElementById('loading-msg');
        const countdownText = document.getElementById('countdown-text');

        // --- 音效合成器 (Web Audio API) ---
        // 為了避免外部音檔載入失敗，我們用原生的 Web Audio API 製作「集氣」和「成功」音效！
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playChargeBeep(progressRatio) {
            // 隨進度增加，音調變高
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 400 + (progressRatio * 400); 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- 初始化 Teachable Machine 模型 ---
        async function initTM() {
            if(isModelLoaded) return;
            loadingMsg.classList.remove('hidden');
            btnStart.innerText = "載入中...";
            btnStart.disabled = true;

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // 檢查是否使用預設假網址，如果是則啟用模擬模式 (供預覽測試用)
                if(URL === "YOUR_TM_MODEL_URL_HERE") {
                    console.warn("未提供 TM 模型網址，將啟用模擬測試模式。");
                    simulateInitialization();
                    return;
                }

                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // 設置 Webcam
                const size = Math.min(window.innerWidth, window.innerHeight) * 0.8; // 基於視窗大小
                const flip = true; 
                webcam = new tmPose.Webcam(200, 200, flip); // 改為 1:1 正方形解析度 (720x720)，避免變形與剪裁
                await webcam.setup(); 
                await webcam.play();
                
                // 準備 Canvas
                const canvas = document.createElement("canvas");
                canvas.width = 200;
                canvas.height = 200;
                ctx = canvas.getContext("2d");
                document.getElementById("webcam-container").appendChild(canvas);
                
                isModelLoaded = true;
                window.requestAnimationFrame(loop);
                
                loadingMsg.classList.add('hidden');
                btnStart.innerText = "開始挑戰 START";
                btnStart.disabled = false;

            } catch (err) {
                alert("無法載入模型，請檢查控制台錯誤。若是在預覽環境，請使用模擬模式。");
                console.error(err);
                simulateInitialization(); // 發生錯誤時切換到模擬模式
            }
        }

        // --- 遊戲流程控制 ---
        
        // 1. 開始遊戲按鈕事件
        btnStart.addEventListener('click', async () => {
            if(!isModelLoaded) {
                await initTM();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startGame();
        });

        // 打亂陣列 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function startGame() {
            // 切換畫面
            screenStart.classList.remove('active-screen');
            screenStart.classList.add('hidden-screen');
            screenGame.classList.remove('hidden-screen');
            screenGame.classList.add('active-screen');

            // 準備關卡資料
            currentPosesQueue = shuffleArray([...GAME_POSES]);
            currentLevel = 1;
            isGameRunning = true;
            
            setupNextLevel();
        }

        function setupNextLevel() {
            if (currentPosesQueue.length === 0) {
                triggerSuccess();
                return;
            }

            currentTargetPose = currentPosesQueue.shift();
            
            // 更新 UI
            uiLevel.innerText = currentLevel;
            uiPoseName.innerText = currentTargetPose.name;
            

            // ✅ 修改後：取得 img 標籤，並更改它的 src 屬性
            const poseImg = document.getElementById('pose-img');
            poseImg.src = currentTargetPose.image;
            
            resetProgress();
            
            // 顯示過場動畫
            showTransition(`關卡 ${currentLevel}：${currentTargetPose.name}!`);
        }

        function showTransition(text) {
            transitionText.innerText = text;
            levelTransition.style.opacity = '1';
            transitionText.style.transform = 'scale(1.2)';
            
            setTimeout(() => {
                levelTransition.style.opacity = '0';
                transitionText.style.transform = 'scale(0.5)';
            }, 1500); // 1.5秒後消失
        }

        function triggerSuccess() {
            isGameRunning = false;
            screenGame.classList.remove('active-screen');
            screenGame.classList.add('hidden-screen');
            screenSuccess.classList.remove('hidden-screen');
            screenSuccess.classList.add('active-screen');

            playSuccessSound();

            // Canvas Confetti 彩帶噴發特效
            let duration = 3 * 1000;
            let animationEnd = Date.now() + duration;
            let defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            let interval = setInterval(function() {
                let timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                let particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // 自動倒數回首頁
            let timeLeft = 60;
            countdownText.innerText = `${timeLeft} 秒後自動回到首頁...`;
            returnHomeTimeout = setInterval(() => {
                timeLeft--;
                countdownText.innerText = `${timeLeft} 秒後自動回到首頁...`;
                if(timeLeft <= 0) {
                    resetToHome();
                }
            }, 1000);
        }

        // 返回首頁按鈕
        btnHome.addEventListener('click', resetToHome);

        function resetToHome() {
            clearInterval(returnHomeTimeout);
            screenSuccess.classList.remove('active-screen');
            screenSuccess.classList.add('hidden-screen');
            screenStart.classList.remove('hidden-screen');
            screenStart.classList.add('active-screen');
            resetProgress();
        }

        // --- 核心更新邏輯 (Frame Loop) ---

        async function loop(timestamp) {
            webcam.update(); // 刷新鏡頭
            
            if (isGameRunning && levelTransition.style.opacity === '0') {
                await predict(timestamp);
            } else if (!isGameRunning && isModelLoaded) {
                // 如果在待機畫面，只畫骨架不作判斷，吸引目光
                const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
                drawPoseOnCanvas(pose);
            }
            window.requestAnimationFrame(loop);
        }

        async function predict(timestamp) {
            // 預測姿勢
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            // 尋找目前目標姿勢的信心水準
            let currentConfidence = 0;
            for (let i = 0; i < maxPredictions; i++) {
                // 假設你在 TM 設定的 Class 名字剛好等於 "隱身", "偽裝", "平衡"
                // 實務上請確保 TM 的 class name 和 GAME_POSES 裡的 name 完全一致！
                if (prediction[i].className === currentTargetPose.name) {
                    currentConfidence = prediction[i].probability;
                    break;
                }
            }

            handleGameLogic(currentConfidence, timestamp);
            drawPoseOnCanvas(pose); // 畫出優化過後的骨架
        }

        function handleGameLogic(confidence, timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            if (confidence >= CONFIDENCE_THRESHOLD) {
                // 姿勢正確，開始/繼續集氣
                if (!isHolding) {
                    isHolding = true;
                    holdStartTime = timestamp;
                }
                
                let holdDuration = timestamp - holdStartTime;
                let progressRatio = holdDuration / REQUIRED_HOLD_TIME;
                
                // 更新 UI 能量條
                progressFill.style.width = `${Math.min(progressRatio * 100, 100)}%`;
                
                // 每 200ms 發出滴滴聲
                if (holdDuration % 200 < 50) { 
                    playChargeBeep(progressRatio); 
                }

                // 加入發光特效
                progressFill.classList.add('charging-glow');
                
                // 顏色漸變 (Tailwind 的 class 處理比較死，這裡用 inline CSS 覆蓋比較平滑)
                if(progressRatio > 0.6) {
                    progressFill.style.backgroundColor = '#ef4444'; // 紅色 (快滿了)
                } else if (progressRatio > 0.3) {
                    progressFill.style.backgroundColor = '#eab308'; // 黃色
                }

                // 檢查是否達標 3 秒
                if (holdDuration >= REQUIRED_HOLD_TIME) {
                    currentLevel++;
                    setupNextLevel();
                }

            } else {
                // 姿勢走樣或放下來了，迅速歸零
                resetProgress();
            }
        }

        function resetProgress() {
            isHolding = false;
            holdStartTime = 0;
            progressFill.style.width = '0%';
            progressFill.classList.remove('charging-glow');
            progressFill.style.backgroundColor = ''; // 恢復預設 class 顏色
        }

        // --- 視覺優化：繪製骨架 ---
        function drawPoseOnCanvas(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    // Sunny 的優化：把線條加粗，顏色換成搶眼的螢光藍/綠，增加科技感！
                    ctx.lineWidth = 8;
                    ctx.strokeStyle = '#00ffcc'; // 螢光青色
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx, 6, '#ffff00'); // 節點用黃色，半徑6
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx, 8, '#00ffcc'); 
                }
            }
        }


        // =========================================================================
        // 【模擬模式】 供沒有真實模型/Webcam 的環境測試預覽 UI 使用
        // =========================================================================
        function simulateInitialization() {
            console.log("--- 啟動模擬測試模式 ---");
            isModelLoaded = true;
            loadingMsg.classList.add('hidden');
            btnStart.innerText = "開始挑戰 START";
            btnStart.disabled = false;
            
            // 創建一個假的 Canvas 背景
            const canvas = document.createElement("canvas");
            canvas.width = 640;
            canvas.height = 480;
            ctx = canvas.getContext("2d");
            document.getElementById("webcam-container").appendChild(canvas);
            
            // 監聽滑鼠移動來模擬信心水準 (滑鼠在畫面右半邊視為姿勢正確 > 0.85)
            let mockConfidence = 0;
            document.body.addEventListener('mousemove', (e) => {
                if(isGameRunning) {
                    mockConfidence = (e.clientX / window.innerWidth > 0.5) ? 0.9 : 0.1;
                }
            });

            // 假的迴圈
            function mockLoop(timestamp) {
                // 畫假背景
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#cbd5e1";
                ctx.font = "30px sans-serif";
                ctx.fillText("模擬鏡頭畫面 (請將滑鼠移至視窗右側模擬)", 60, 360);

                if (isGameRunning && levelTransition.style.opacity === '0') {
                    handleGameLogic(mockConfidence, timestamp);
                }
                window.requestAnimationFrame(mockLoop);
            }
            window.requestAnimationFrame(mockLoop);
        }

    </script>
