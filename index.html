<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心誠中學 AI 魔法學院</title>
  
  <!-- 這是 AI 魔法書：TensorFlow.js 與 Teachable Machine 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

  <style>
    /* CSS 裝潢區 */
    body {
      font-family: "微軟正黑體", sans-serif;
      background-color: #f4fbf4; 
      text-align: center;
      margin: 0; padding: 20px;
    }
    .screen { display: none; }
    .screen.active {
      display: block; 
      animation: fadeIn 0.5s;
    }
    .progress-container {
      width: 80%; height: 40px; background-color: #ddd;
      border-radius: 20px; margin: 20px auto;
      border: 3px solid #333; overflow: hidden;
    }
    .progress-bar {
      width: 0%; /* 遊戲開始時是 0% */
      height: 100%; background-color: #4CAF50;
      transition: width 0.1s linear; /* 讓集氣看起來很滑順 */
    }
    .game-layout {
      display: flex; justify-content: center; gap: 40px; margin-top: 20px;
    }
    .hint-box, .webcam-placeholder {
      width: 500px; height: 500px; background-color: #e0e0e0;
      border: 2px dashed #999; display: flex;
      align-items: center; justify-content: center; border-radius: 15px;
      overflow: hidden; /* 讓鏡頭畫面乖乖在框內 */
    }
    .game-btn {
      font-size: 24px; padding: 10px 30px; background-color: #ff9800;
      color: white; border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-top: 20px;
    }
    .game-btn:hover { background-color: #f57c00; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="game-app">
    <!-- 1. 待機畫面 -->
    <div id="screen-attract" class="screen active">
      <h1>🌸 心誠中學 AI 魔法學院 🌸</h1>
      <p>請走到地貼位置，準備開始你的魔法試煉！</p>
      <button id="btn-start" class="game-btn">開始挑戰</button>
    </div>

    <!-- 2. 闖關畫面 -->
    <div id="screen-game" class="screen">
      <!-- 能量條 -->
      <div class="progress-container">
        <div id="energy-bar" class="progress-bar"></div>
      </div>
      
      <div class="game-layout">
        <!-- 左側：關卡提示 -->
        <div class="hint-area">
          <h2 id="level-text">🌸 姿勢 1：泥土裡的幼苗</h2>
          <div class="hint-box" id="hint-image">請擺出幼苗的姿勢！(蹲下)</div>
        </div>
        <!-- 右側：Webcam 畫面 -->
        <div class="webcam-area">
          <div id="webcam-container" class="webcam-placeholder">鏡頭啟動中...</div>
        </div>
      </div>
    </div>

    <!-- 3. 通關畫面 -->
    <div id="screen-success" class="screen">
      <h1>🎉 任務完成！你是一朵美麗的花！ 🎉</h1>
      <button id="btn-restart" class="game-btn">再玩一次</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 遊戲核心邏輯與 AI 引擎
    // ==========================================

    // ⚠️ 記得把這裡換成你的模型網址！⚠️
    const URL = "https://teachablemachine.withgoogle.com/models/eVCVTj9bp/"; 
    
    let model, webcam, ctx, maxPredictions;

    // 遊戲狀態變數
    let currentLevel = 0; // 0: 幼苗, 1: 綠葉, 2: 開花
    let energy = 0;       // 能量值 0 到 100
    let isPlaying = false; // 控制遊戲是否在進行中
    
    // 關卡設定
    const levelNames = ["🌸 姿勢 1：泥土裡的幼苗", "🌿 姿勢 2：長出綠葉", "🌺 姿勢 3：太陽花盛開"];
    const levelTargetClasses = [0, 1, 2]; // 假設你在 TM 錄製的順序是 0=幼苗, 1=綠葉, 2=開花

    // 抓取網頁元素
    const screenAttract = document.getElementById('screen-attract');
    const screenGame = document.getElementById('screen-game');
    const screenSuccess = document.getElementById('screen-success');
    const btnStart = document.getElementById('btn-start');
    const btnRestart = document.getElementById('btn-restart');
    const energyBar = document.getElementById('energy-bar');
    const levelText = document.getElementById('level-text');

    // 畫面切換函數
    function showScreen(screenToShow) {
      screenAttract.classList.remove('active');
      screenGame.classList.remove('active');
      screenSuccess.classList.remove('active');
      screenToShow.classList.add('active');
    }

    // 按下開始按鈕
    btnStart.addEventListener('click', () => {
      showScreen(screenGame);
      currentLevel = 0;
      energy = 0;
      energyBar.style.width = "0%";
      levelText.innerText = levelNames[currentLevel];
      isPlaying = true;
      init(); // 啟動 AI 鏡頭
    });

    // 按下重新開始
    btnRestart.addEventListener('click', () => {
      showScreen(screenAttract);
    });

    // 初始化 AI 模型
    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 500;
        const flip = true; 
        webcam = new tmPose.Webcam(size, size, flip); 
        await webcam.setup(); 
        await webcam.play();
        
        window.requestAnimationFrame(loop);

        const container = document.getElementById("webcam-container");
        container.innerHTML = ""; 
        container.appendChild(webcam.canvas);
        ctx = webcam.canvas.getContext("2d");
    }

    // 遊戲迴圈
    async function loop(timestamp) {
        if (!isPlaying) return; // 如果遊戲結束就停止更新
        webcam.update(); 
        await predict(); 
        window.requestAnimationFrame(loop); 
    }

    // 預測與能量條邏輯
    async function predict() {
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        // --- 核心：能量條集氣邏輯 ---
        // 抓出目前關卡要求的動作機率 (例如目前是關卡0 幼苗)
        let targetIndex = levelTargetClasses[currentLevel];
        let currentProb = prediction[targetIndex].probability;

        if (currentProb > 0.85) {
            // 如果動作正確且機率大於 85%，能量增加！
            // 每次迴圈約 16 毫秒，加 0.6 大約 2.5 ~ 3 秒會集滿 (100)
            energy += 0.6; 
        } else {
            // 一旦姿勢走樣，能量瞬間無情歸零！
            energy = 0; 
        }

        // 確保能量不會超過 100
        if (energy > 100) energy = 100;
        
        // 更新 CSS 進度條的寬度
        energyBar.style.width = energy + "%";

        // 檢查是否過關
        if (energy >= 100) {
            levelUp();
        }

        // 畫出骨架
        drawPose(pose);
    }

    // 過關邏輯
    function levelUp() {
        currentLevel++; // 進入下一關
        energy = 0;     // 能量清空，準備下一輪集氣
        energyBar.style.width = "0%";

        if (currentLevel >= 3) {
            // 如果三關都破了，遊戲勝利！
            isPlaying = false;
            webcam.stop(); // 關閉鏡頭省資源
            showScreen(screenSuccess);
        } else {
            // 還有下一關，更新畫面提示文字
            levelText.innerText = levelNames[currentLevel];
        }
    }

    // 畫筆邏輯
    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                const minPartConfidence = 0.5; 
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }
  </script>
</body>
</html>
